<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13112b">
</head>
<body>
<title>Cumple de Estanis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a one-screen phone app. Each state is a full-height "screen" (landing, lobby, question, result, podium); big tap targets; four colored answer tiles with shapes. Single dark "fiesta" look by choice. */
:root{
  --bg:#13112b; --bg2:#1e1b45; --bg3:#2b2763; --fg:#fbf8ff; --muted:#aea8dc; --line:#3c3879;
  --accent:#ff7a59; --accent2:#ffd166; --ok:#3ddc97; --bad:#ff5c7a;
  --tA:#ff5c7a; --tB:#3d8bff; --tC:#f2a900; --tD:#2ec4b6;
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:600px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{font:600 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.25)}
.pill.off i{background:var(--bad)}
.screen{display:flex;flex-direction:column;gap:16px;flex:1;min-width:0}
.center{justify-content:center;text-align:center}
h1{font:700 clamp(34px,9vw,52px)/1.05 var(--display);margin:0;text-wrap:balance}
h2{font:600 26px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 20px/1.2 var(--display);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent2)}
.q{font:600 clamp(22px,6vw,30px)/1.2 var(--display);text-wrap:balance}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
textarea{min-height:46vh;font:500 14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
input.name{font:600 24px/1.1 var(--display);text-align:center;padding:18px}
.btn{font:600 19px/1 var(--display);background:var(--accent);color:#1a0b06;border:0;border-radius:16px;padding:18px 20px;width:100%;cursor:pointer;transition:transform .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.big{padding:30px 20px;font-size:34px;border-radius:24px}
.btn.ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--line)}
.btn.slim{padding:12px 14px;font-size:16px;width:auto;border-radius:12px}
.btn.gold{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:8px}
.timer{position:relative;height:14px;background:var(--bg3);border-radius:99px;overflow:hidden}
.timer i{position:absolute;inset:0;background:var(--accent2);transform-origin:left center;transform:scaleX(1);border-radius:99px}
.timer.hot i{background:var(--bad)}
.tnum{font:700 48px/1 var(--display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.tnum.hot{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--bg3);color:#fff;font:700 18px/1.25 var(--body);min-height:74px;width:100%;border:0;text-align:left;cursor:pointer;transition:transform .08s ease,opacity .2s ease}
.opt:active{transform:scale(.985)}
.opt .sh{font-size:26px;width:34px;text-align:center;flex:none;line-height:1}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .ct{flex:none;font:800 14px var(--body);background:rgba(0,0,0,.25);border-radius:99px;padding:6px 10px;font-variant-numeric:tabular-nums}
.opt.a{background:var(--tA)} .opt.b{background:var(--tB)} .opt.c{background:var(--tC);color:#231a00} .opt.d{background:var(--tD);color:#042522}
.opt.dim{opacity:.3}
.opt.right{box-shadow:0 0 0 4px #fff inset}
.opt.mine{box-shadow:0 0 0 4px var(--accent2) inset}
.opt.right.mine{box-shadow:0 0 0 4px #fff inset,0 0 0 8px var(--accent2) inset}
.opt:disabled{cursor:default}
.verdict{font:700 clamp(36px,11vw,60px)/1 var(--display)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.pts{font:700 clamp(40px,14vw,76px)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent2)}
.score{font:600 18px var(--display);color:var(--muted)}
.score b{color:var(--fg);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.li .n{font:700 15px var(--body);color:var(--muted);width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.li .sc{font:700 16px var(--display);font-variant-numeric:tabular-nums}
.li .d{font:700 13px var(--body);color:var(--ok);font-variant-numeric:tabular-nums}
.li.me{border-color:var(--accent2)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:8px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pd .nm{font:700 15px var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .sc{font:600 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.pd .bar{width:100%;border-radius:12px 12px 4px 4px;background:var(--bg3);display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:700 30px var(--display)}
.pd.p1 .bar{height:130px;background:linear-gradient(180deg,#ffd166,#c99400)} .pd.p2 .bar{height:95px;background:linear-gradient(180deg,#d9d6e8,#8f8aa8)} .pd.p3 .bar{height:70px;background:linear-gradient(180deg,#e4a06c,#9d5a2b)}
.pd.p1 .bar,.pd.p2 .bar,.pd.p3 .bar{color:#1a1200}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-row .lab{width:30px;font:700 18px var(--display);text-align:center;flex:none}
.bar-row .tr{flex:1;height:22px;background:var(--bg3);border-radius:8px;overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:8px}
.bar-row .ct{width:3ch;font:700 15px var(--body);font-variant-numeric:tabular-nums;text-align:right}
.err{white-space:pre-line;background:rgba(255,92,122,.12);border:1px solid var(--bad);border-radius:12px;padding:12px;color:#ffd0da;font-size:14px}
.ok-note{background:rgba(61,220,151,.12);border:1px solid var(--ok);border-radius:12px;padding:12px;color:#d6fff0;font-size:14px}
.foot{margin-top:auto;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font:700 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
label.f input{font:600 18px var(--body);text-transform:none;letter-spacing:0;padding:12px 14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.opt,.btn{transition:none}}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.kbd{font:600 13px ui-monospace,Menlo,monospace;background:var(--bg3);border-radius:6px;padding:2px 6px}
</style>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
'use strict';
const LIVE = true;
const HOST_NAME = 'Estanis';
const ROOM = 'cumple-estanis-2410';
const BROKERS = ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const DEFAULT_CFG = { grace:5, total:30, max:1000, min:300, pin:'2410' };
const QV = 6; // bump when the default questions change so an existing host picks them up
const DEFAULT_QUESTIONS = [
  {q:'¿Cuándo es el cumpleaños de Estanis?', opts:['20 de octubre','21 de octubre','24 de octubre','20 y 21 de octubre'], ans:3},
  {q:'¿Cuál es la bebida favorita de Estanis?', opts:['Coca','Fanta','Limonada','Aquarius de pera'], ans:2},
  {q:'¿Cuál es la marca personal de Estanis en 800 metros?', opts:['1:45.10','1:47.35','1:49.80','1:52.00'], ans:1},
  {q:'¿Cuál es la fruta favorita de Estanis?', opts:['Bananas','Frutillas','Pera','Manzanas'], ans:0},
  {q:'¿Cuántos perros tuvo Estanis?', opts:['1','2','3','4'], ans:1},
  {q:'¿Qué prefiere Estanis como destino de vacaciones?', opts:['La playa','El sur','Europa','El desierto'], ans:0},
  {q:'¿Cuántas bananas comió Estanis en Salta el día que Mati le dijo que no podía comer más?', opts:['4','5','6','7'], ans:3},
  {q:'¿Quién es la profesora o maestra favorita de Estanis?', opts:['Julio Perlioni','Martín Garay','Rosita','Sergio López'], ans:2},
  {q:'¿Qué marca (PB) hizo Estanis en 1000 metros en 2012?', opts:['2’59”','3’03”','3’12”','3’05”'], ans:1},
  {q:'¿Cuál es la ciudad favorita de Estanis en Europa?', opts:['París','Roma','Budapest','Copenhague'], ans:2},
  {q:'¿En qué torneo corrió Estanis su mejor carrera de 800 metros?', opts:['Nacional Mayores','Metropolitano','Gran Prix Argentino','EL LEGENDARIO Gerardo Bönhoff'], ans:3},
  {q:'¿Cuál es la película favorita de Estanis?', opts:['Bastardos sin gloria','Inception','Fragmentado','Akira'], ans:1},
  {q:'¿Cuál es el color favorito de Estanis? (el de antes y el de ahora)', opts:['Antes azul, ahora rojo','Antes rojo, ahora azul','Antes verde, ahora azul','Antes azul, ahora verde'], ans:2},
  {q:'¿Cuál es la comida favorita de Estanis?', opts:['Milanesa','Hamburguesa','Sushi','Salmón'], ans:1},
  {q:'¿Cuál es la mejor marca oficial de Estanis en 200 metros?', opts:['21.98','22.36','22.89','23.54'], ans:3},
  {q:'¿Cuál es la mejor marca de Estanis en jabalina (600 g, 2017)?', opts:['32.79','36.48','39.45','42.30'], ans:1}
];
const LETTERS = ['A','B','C','D'], SHAPES = ['▲','◆','●','■'], CLS = ['a','b','c','d'];

// ---------- utils
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k, d){ try { const v = localStorage.getItem('cumple:'+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem('cumple:'+k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem('cumple:'+k); } catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function calcPoints(elapsedMs, cfg){
  const t = elapsedMs/1000, g = +cfg.grace, T = +cfg.total, M = +cfg.max, m = +cfg.min;
  if (t <= g) return M; if (t >= T) return m;
  return Math.round(M - (M - m) * (t - g) / (T - g));
}
function parseQuestions(text){
  const blocks = String(text).replace(/\r/g,'').split(/\n\s*\n+/).map(b => b.trim()).filter(Boolean);
  const out = [], errors = [];
  blocks.forEach((b, i) => {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    const q = (lines[0] || '').replace(/^\d+[).:]\s*/, '');
    if (lines.length < 5) { errors.push(`Pregunta ${i+1} ("${q.slice(0,30)}"): faltan líneas. Van: pregunta, 4 opciones y la respuesta.`); return; }
    const opts = []; let ans = -1;
    for (let k = 1; k <= 4; k++) {
      let l = lines[k]; let star = false;
      if (/^\*/.test(l)) { star = true; l = l.slice(1).trim(); }
      const m = l.match(/^([a-dA-D])[).:\-]\s*(.+)$/);
      if (!m) { errors.push(`Pregunta ${i+1} ("${q.slice(0,30)}"): la opción ${k} tiene que empezar con A) B) C) o D).`); return; }
      opts.push(m[2].trim()); if (star) ans = k - 1;
    }
    if (opts.length !== 4) return;
    for (const l of lines.slice(5)) { const rm = l.match(/^(?:r|resp|respuesta|correcta)\s*[:\-]?\s*([a-dA-D])\b/i); if (rm) ans = LETTERS.indexOf(rm[1].toUpperCase()); }
    if (ans < 0) { errors.push(`Pregunta ${i+1} ("${q.slice(0,30)}"): falta la respuesta. Agregá una línea "R: B" o un * delante de la opción correcta.`); return; }
    out.push({ q, opts, ans });
  });
  if (!out.length && !errors.length) errors.push('No encontré ninguna pregunta.');
  return { questions: out, errors };
}
function formatQuestions(qs){
  return qs.map((x, i) => `${i+1}) ${x.q}\n` + x.opts.map((o, k) => `${LETTERS[k]}) ${o}`).join('\n') + `\nR: ${LETTERS[x.ans]}`).join('\n\n');
}
function rankOf(players, id){ const s = players.slice().sort((a,b)=>b.score-a.score); const i = s.findIndex(p=>p.id===id); return i < 0 ? null : i+1; }
function medal(i){ return ['🥇','🥈','🥉'][i] || (i+1)+'.'; }

// ---------- app state
let role = lsGet('role', null);           // 'host' | 'player' | null
let hostCfg = Object.assign({}, DEFAULT_CFG, lsGet('cfg', {}));
let PL = Object.assign({ id: uid(), name:'', score:0, qi:0, screen:'lobby', myOpt:null, localStart:0, qkey:'', gameId:'', answers:{} }, lsGet('player', {}));
let view = { pinErr:'', editErr:'', editOk:false, cfgOk:false, menu:false, hostPage:'' };
const live = { client:null, connected:false, state:null, lastHostSeen:0, lastJoinSent:0, status:'off' };
let H = lsGet('host', null); // host game object (live mode)
function savePL(){ lsSet('player', PL); }
function saveH(){ lsSet('host', H); }
function saveCfg(){ lsSet('cfg', hostCfg); }
function newGame(){
  H = { gameId: uid(), phase:'lobby', qi:-1, players:{}, answers:{}, startedAt:0, endsAt:0, questions: (H && H.questions && H.questions.length) ? H.questions : DEFAULT_QUESTIONS.map(q=>({...q, opts:q.opts.slice()})), qv: (H && H.qv) || QV, revealAt:0 };
  saveH();
}
if (!H) newGame();
if (H.qv !== QV) { H.questions = DEFAULT_QUESTIONS.map(q=>({...q, opts:q.opts.slice()})); H.qv = QV; if (H.phase !== 'lobby') { H.phase = 'lobby'; H.qi = -1; H.answers = {}; H.lastReveal = null; H.startedAt = 0; H.endsAt = 0; } saveH(); }
function activePlayers(){ const now = Date.now(); return Object.values(H.players).filter(p => now - (p.lastSeen||0) < 150000); }

// ---------- rendering
const app = $('#app');
function topbar(status){
  let pill = '';
  if (LIVE) {
    const s = live.status;
    pill = `<span class="pill ${s==='on'?'on':s==='off'?'off':''}" id="pill"><i></i>${s==='on'?'En vivo':s==='off'?'Sin conexión':'Conectando…'}</span>`;
  } else pill = `<span class="pill"><i></i>A la voz</span>`;
  return `<div class="top"><div class="brand">🎂 Cumple de ${HOST_NAME}</div>${status ?? pill}</div>`;
}
function timerHtml(){ return `<div class="row"><div class="timer grow" id="tbar"><i></i></div><div class="tnum" id="tnum">${hostCfg.total}</div></div>`; }
function optsHtml(q, opts){
  return `<div class="opts">${q.opts.map((o,k)=>`<button class="opt ${CLS[k]} ${opts.cls?opts.cls(k):''}" data-act="${opts.act||''}" data-k="${k}" ${opts.disabled?'disabled':''}><span class="sh">${SHAPES[k]}</span><span class="tx">${esc(o)}</span>${opts.count?`<span class="ct">${opts.count[k]||0}</span>`:''}</button>`).join('')}</div>`;
}

function render(){
  let html;
  if (role === 'host') html = renderHost();
  else if (view.hostPage === 'pin') html = tplPin();
  else html = renderPlayer();
  app.innerHTML = html;
  const nm = $('#name'); if (nm && !nm.value) nm.focus();
  tick();
}

// ----- player
function renderPlayer(){
  if (!PL.name) return tplLanding();
  if (!LIVE) return renderLocalPlayer();
  const st = live.state;
  if (!st) return topbar() + `<div class="screen center"><div class="eyebrow">Hola, ${esc(PL.name)}</div><h2>Buscando a ${HOST_NAME}…</h2><p class="muted">${live.status==='off'?'No hay conexión. Fijate el wifi o los datos y recargá la página.':'Un segundo, me estoy conectando.'}</p>${tplLeave()}</div>`;
  const me = (st.players||[]).find(p => p.id === PL.id);
  const stale = Date.now() - live.lastHostSeen > 20000;
  const staleNote = stale ? `<p class="muted small">El anfitrión no da señales hace un rato… esperá.</p>` : '';
  if (st.phase === 'lobby') {
    return topbar() + `<div class="screen center"><div class="eyebrow">Hola, ${esc(PL.name)}</div><h1>¡Ya estás adentro!</h1><p class="muted">Esperá a que ${HOST_NAME} arranque el juego.</p><p class="score">${(st.players||[]).length} jugador${(st.players||[]).length===1?'':'es'} conectad${(st.players||[]).length===1?'o':'os'}</p>${staleNote}${tplLeave()}</div>`;
  }
  const q = st.question;
  const key = st.gameId + ':' + st.qi;
  if (st.phase === 'question') {
    const answered = PL.qkey === key && PL.myOpt != null;
    const timeUp = Date.now() - PL.localStart >= st.cfg.total*1000;
    return topbar() + `<div class="screen"><div class="row"><span class="eyebrow">Pregunta ${st.qi+1} de ${st.total}</span><span class="score grow" style="text-align:right">${me?`<b>${me.score}</b> pts`:''}</span></div>${timerHtml()}<div class="q">${esc(q.q)}</div>` +
      (answered ? `<div class="card center pop"><h2>Respuesta enviada 🔒</h2><p class="muted">Elegiste ${LETTERS[PL.myOpt]} ${SHAPES[PL.myOpt]}. Esperá a que termine la ronda.</p></div>` :
       timeUp ? `<div class="card center"><h2>¡Se acabó el tiempo!</h2><p class="muted">Esta no suma. La próxima, más rápido.</p></div>` :
       optsHtml(q, { act:'answer' })) + `</div>`;
  }
  if (st.phase === 'reveal') {
    const r = st.reveal || {}; const mine = (r.results||{})[PL.id];
    const rank = me ? rankOf(st.players, PL.id) : null;
    let verdict;
    if (!mine) verdict = `<div class="verdict bad">Sin respuesta</div><p class="muted">Esta no sumó.</p>`;
    else if (mine.correct) verdict = `<div class="verdict ok pop">¡Correcto!</div><div class="pts pop">+${mine.points}</div><p class="muted">Respondiste en ${(mine.elapsed/1000).toFixed(1)} s</p>`;
    else verdict = `<div class="verdict bad pop">Nooo…</div><p class="muted">Era la ${LETTERS[r.ans]} ${SHAPES[r.ans]}. Respondiste en ${(mine.elapsed/1000).toFixed(1)} s.</p>`;
    return topbar() + `<div class="screen center"><span class="eyebrow">Pregunta ${st.qi+1} de ${st.total}</span>${verdict}<div class="score">Total: <b>${me?me.score:0}</b> pts${rank?` · puesto <b>${rank}</b> de ${st.players.length}`:''}</div>${optsHtml(q,{disabled:true, cls:k=> (k===r.ans?'right ':'') + (mine&&mine.opt===k?'mine ':'') + (k!==r.ans&&!(mine&&mine.opt===k)?'dim':'')})}<p class="muted small">Esperá a que ${HOST_NAME} pase a la siguiente.</p></div>`;
  }
  if (st.phase === 'end') {
    const rank = me ? rankOf(st.players, PL.id) : null;

// ---------- timer tick
let lastTimeUp = '';
function currentDeadline(){
  if (role === 'host') {
    if (H.phase !== 'question' || !H.startedAt) return null;
    return { start:H.startedAt, end:H.endsAt, key:'h'+H.gameId+H.qi };
  }
  if (LIVE) { const st = live.state; if (!st || st.phase !== 'question' || !PL.localStart) return null; return { start:PL.localStart, end:PL.localStart + st.cfg.total*1000, key:'p'+PL.qkey }; }
  if (PL.screen === 'question') return { start:PL.localStart, end:PL.localStart + hostCfg.total*1000, key:'l'+PL.qi+PL.localStart };
  return null;
}
function tick(){
  const d = currentDeadline(); const bar = $('#tbar'), num = $('#tnum');
  if (!d) { if (bar) { bar.firstElementChild.style.transform = 'scaleX(1)'; } return; }
  const now = Date.now(); const left = Math.max(0, d.end - now); const frac = left / (d.end - d.start);
  if (bar) { bar.firstElementChild.style.transform = `scaleX(${frac})`; bar.classList.toggle('hot', left <= 5000); }
  if (num) { num.textContent = Math.ceil(left/1000); num.classList.toggle('hot', left <= 5000); }
  if (left <= 0 && lastTimeUp !== d.key) { lastTimeUp = d.key; onTimeUp(); }
}
setInterval(tick, 100);
function onTimeUp(){
  if (role === 'host') {
    if (LIVE) { if (H.phase === 'question') setTimeout(() => { if (H.phase === 'question') hostReveal(); }, 1500); }
    else render();
    return;
  }
  render(); // player: re-render shows "tiempo" / local result
}

// ---------- live mode: MQTT
const T = { state: ROOM + '/state', join: ROOM + '/join', answer: ROOM + '/answer' };
let brokerIdx = 0; { const m = (location.hash||'').match(/b([123])/); if (m) brokerIdx = +m[1]-1; }
function ensureMqtt(){
  if (!LIVE || live.client || typeof mqtt === 'undefined') { if (LIVE && typeof mqtt === 'undefined') { live.status = 'off'; } return; }
  live.status = 'connecting';
  const c = mqtt.connect(BROKERS[brokerIdx], { clientId: 'cumple_' + uid(), keepalive: 30, reconnectPeriod: 2000, connectTimeout: 10000, clean: true, protocolVersion: 4 });
  live.client = c;
  c.on('connect', () => {
    live.connected = true; live.status = 'on';
    c.subscribe([T.state, T.join, T.answer], { qos: 1 });
    if (role === 'host') publishState(); else if (PL.name) sendJoin(true);
    updatePill();
  });
  c.on('reconnect', () => { live.status = 'connecting'; updatePill(); });
  c.on('close', () => { live.connected = false; if (live.status === 'on') { live.status = 'connecting'; updatePill(); } });
  c.on('error', () => { live.status = live.connected ? 'connecting' : 'off'; });
  c.on('message', (topic, payload) => {
    let msg; try { msg = JSON.parse(payload.toString()); } catch(e){ return; }
    if (!msg || typeof msg !== 'object') return;
    if (topic === T.state && role !== 'host') handleState(msg);
    else if (role === 'host' && topic === T.join) hostOnJoin(msg);
    else if (role === 'host' && topic === T.answer) hostOnAnswer(msg);
  });
  setTimeout(() => { if (!live.connected && live.status !== 'on') { live.status = 'off'; updatePill(); if (role !== 'host' && PL.name && !live.state) render(); } }, 12000);
}
function updatePill(){ const p = $('#pill'); if (!p) return; const s = live.status; p.className = 'pill ' + (s==='on'?'on':s==='off'?'off':''); p.innerHTML = '<i></i>' + (s==='on'?'En vivo':s==='off'?'Sin conexión':'Conectando…'); }
let wakeLock = null;
async function keepAwake(){ try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch(e){ wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && (role === 'host' || PL.name)) keepAwake(); });
function pub(topic, obj, retain){ if (!live.client) return; try { live.client.publish(topic, JSON.stringify(obj), { qos: 1, retain: !!retain }); } catch(e){} }
// player side
function sendJoin(force){
  if (!live.client || !PL.name) return; const now = Date.now();
  if (!force && now - live.lastJoinSent < 4000) return;
  live.lastJoinSent = now; pub(T.join, { id: PL.id, name: PL.name, ts: now });
}
function handleState(st){
  if (!st || !st.gameId) return;
  live.state = st; live.lastHostSeen = Date.now();
  if (st.gameId !== PL.gameId) { PL.gameId = st.gameId; PL.qkey = ''; PL.myOpt = null; savePL(); }
  if (st.phase === 'question') {
    const key = st.gameId + ':' + st.qi;
    if (PL.qkey !== key) { const into = Math.max(0, (st.hostTs || st.startedAt) - st.startedAt); PL.qkey = key; PL.localStart = Date.now() - into; PL.myOpt = null; savePL(); }
  }
  if (PL.name && !(st.players||[]).some(p => p.id === PL.id)) sendJoin(false);
  const sig = [st.gameId, st.phase, st.qi, (st.players||[]).map(p=>p.id+':'+p.name+':'+p.score).join('|'), JSON.stringify(st.reveal||null), JSON.stringify(st.question||null), JSON.stringify(st.cfg||null)].join('#');
  if (role !== 'host' && PL.name && sig !== live.sig) { live.sig = sig; render(); }
}
function playerAnswer(k){
  const st = live.state; if (!st || st.phase !== 'question') return;
  const key = st.gameId + ':' + st.qi; if (PL.qkey !== key || PL.myOpt != null) return;
  const elapsed = Math.max(0, Date.now() - PL.localStart);
  if (elapsed > st.cfg.total*1000) { render(); return; }
  PL.myOpt = k; savePL();
  const msg = { id: PL.id, name: PL.name, gameId: st.gameId, qi: st.qi, opt: k, elapsed, ts: Date.now() };
  pub(T.answer, msg); setTimeout(() => pub(T.answer, msg), 700); // belt and braces
  render();
}
// host side
let pubTimer = null;
function buildState(){
  const players = Object.values(H.players).map(p => ({ id:p.id, name:p.name, score:p.score })).sort((a,b)=>b.score-a.score);
  const q = (H.phase === 'question' || H.phase === 'reveal') ? H.questions[H.qi] : null;
  return { v:1, gameId:H.gameId, phase:H.phase, qi:H.qi, total:H.questions.length, cfg:{ grace:hostCfg.grace, total:hostCfg.total, max:hostCfg.max, min:hostCfg.min }, question: q ? { q:q.q, opts:q.opts } : null, startedAt:H.startedAt, endsAt:H.endsAt, hostTs:Date.now(), players, reveal: H.phase === 'reveal' ? H.lastReveal : null };
}
function publishState(){ if (!LIVE || role !== 'host') return; pub(T.state, buildState(), true); }
function schedulePublish(){ clearTimeout(pubTimer); pubTimer = setTimeout(publishState, 250); }
function hostOnJoin(m){
  if (!m.id || typeof m.name !== 'string') return;
  const name = m.name.trim().slice(0,18); if (!name) return;
  const p = H.players[m.id];
  if (p) { p.name = name; p.lastSeen = Date.now(); }
  else H.players[m.id] = { id:String(m.id), name, score:0, joinedAt:Date.now(), lastSeen:Date.now() };
  saveH(); schedulePublish(); if (H.phase === 'lobby' && !view.hostPage) render();
}
function hostOnAnswer(m){
  if (H.phase !== 'question' || m.gameId !== H.gameId || m.qi !== H.qi) return;
  if (!H.players[m.id]) { if (typeof m.name === 'string' && m.name.trim()) H.players[m.id] = { id:String(m.id), name:m.name.trim().slice(0,18), score:0, joinedAt:Date.now(), lastSeen:Date.now() }; else return; }
  H.players[m.id].lastSeen = Date.now();
  const ans = H.answers[H.qi] = H.answers[H.qi] || {};
  if (ans[m.id]) return;
  const now = Date.now(); if (now > H.endsAt + 2500) return;
  const k = +m.opt; if (!(k >= 0 && k <= 3)) return;
  let elapsed = Math.max(0, +m.elapsed || 0); elapsed = Math.min(elapsed, hostCfg.total*1000, Math.max(0, now - H.startedAt) + 1500);
  ans[m.id] = { opt:k, elapsed };
  saveH();
  const c = $('#acount'); if (c) c.textContent = Object.keys(ans).length;
  const act = activePlayers(); if (act.length && act.every(p => ans[p.id])) setTimeout(() => { if (H.phase === 'question') hostReveal(); }, 600);
}
function hostStartQuestion(qi){
  H.phase = 'question'; H.qi = qi; H.startedAt = Date.now(); H.endsAt = H.startedAt + hostCfg.total*1000; H.answers[qi] = {}; H.lastReveal = null;
  saveH(); publishState(); render();
}
function hostReveal(){
  if (H.phase !== 'question') return;
  const q = H.questions[H.qi]; const ans = H.answers[H.qi] || {}; const counts = [0,0,0,0]; const results = {};
  for (const id in ans) { const a = ans[id]; const p = H.players[id]; if (!p) continue; counts[a.opt]++; const correct = a.opt === q.ans; const points = correct ? calcPoints(a.elapsed, hostCfg) : 0; p.score += points; results[id] = { opt:a.opt, correct, points, elapsed:a.elapsed }; }
  H.lastReveal = { ans:q.ans, counts, results }; H.phase = 'reveal';
  saveH(); publishState(); render();
}
// heartbeat so late joiners and reconnecting phones get a fresh state
setInterval(() => { if (role === 'host' && LIVE && live.connected) publishState(); }, 2500);
setInterval(() => { if (role !== 'host' && LIVE && live.state && PL.name) { const st = live.state; if (!(st.players||[]).some(p=>p.id===PL.id)) sendJoin(false); } }, 5000);
setInterval(() => { if (role !== 'host' && LIVE && PL.name) sendJoin(true); }, 15000);

// ---------- confetti (podium screens)
(function(){
  let canvas, ctx, parts = [], raf = 0, lastScreen = '';
  function start(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!canvas) { canvas = document.createElement('canvas'); canvas.className = 'confetti'; document.body.appendChild(canvas); ctx = canvas.getContext('2d'); }
    if (!ctx) return;
    canvas.width = innerWidth; canvas.height = innerHeight; parts = [];
    const cols = ['#ff7a59','#ffd166','#3ddc97','#3d8bff','#ff5c7a','#2ec4b6','#ffffff'];
    for (let i = 0; i < 140; i++) parts.push({ x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.6, w: 6+Math.random()*6, h: 8+Math.random()*8, c: cols[i%cols.length], vy: 2+Math.random()*3, vx: -1+Math.random()*2, r: Math.random()*Math.PI, vr: -0.1+Math.random()*0.2 });
    const t0 = performance.now();
    cancelAnimationFrame(raf);
    (function frame(t){ ctx.clearRect(0,0,canvas.width,canvas.height); let alive = false; for (const p of parts) { p.y += p.vy; p.x += p.vx; p.r += p.vr; if (p.y < canvas.height + 20) alive = true; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); } if (alive && t - t0 < 6000) raf = requestAnimationFrame(frame); else ctx.clearRect(0,0,canvas.width,canvas.height); })(t0);
  }
  setInterval(() => { const s = app.querySelector('.podium') ? 'podium' : ''; if (s && s !== lastScreen) start(); lastScreen = s; }, 300);
})();

// ---------- boot
if (LIVE) ensureMqtt();
render();
</script>
